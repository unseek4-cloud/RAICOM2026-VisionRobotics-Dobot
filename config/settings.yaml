# ============================================================================
# 2026 睿抗机器人开发者大赛（机器视觉/越疆）现场配置
# 文件编码：UTF-8。所有距离统一使用 mm，角度统一使用 degree。
#
# 占位值使用 null。关键现场项未填写时，`python main.py --real` 会报告配置错误。
# ============================================================================

application:
  name: "3D识别抓取"
  competition_timeout_s: 600       # 规则要求现场自动运行不超过 10 分钟
  preview_fps: 12                  # 三路 UI 实时预览目标帧率；YOLO 推理慢时以实际速度为准
  log_level: "INFO"
  result_log_jsonl: "logs/results.jsonl"

network:
  # Dobot Vision Studio 4.1.2 在流程末端作为 TCP 客户端连接本程序。
  dvs:
    listen_host: "0.0.0.0"
    port: 6001
    accept_timeout_s: 1.0
    receive_timeout_s: 1.0
    max_line_bytes: 65536

  # DobotStudio Pro 中运行的 Lua 脚本作为 TCP 客户端连接本程序。
  # 2006 是本项目自定义端口，不是越疆控制器的 29999/30004 官方端口。
  robot_bridge:
    listen_host: "0.0.0.0"
    port: 2006
    command_timeout_s: 120.0
    accept_timeout_s: 1.0
    receive_timeout_s: 1.0
    heartbeat_s: 5.0
    max_line_bytes: 65536

dvs:
  encoding: "utf-8"
  fallback_encoding: "gb18030"
  terminator: "\n"
  delimiter: ","
  # 启动任务一（单独运行或全流程）时，Python 原样向已连接的 DVS 发送这两个字节。
  trigger_text: "ok"
  task1_timeout_s: 30.0
  expected_results: 1
  # 现场任务书若明确必须有 a/b/c/二维码/字符等字段，在此填写；空列表表示只要收到
  # 一条非空结果即可。示例：["a", "b", "c", "qr"]
  required_fields: []

camera:
  serial: null                     # 多台 RealSense 时填写 D435 序列号
  # D435 最大彩色流；深度传感器最大分辨率不同，必须独立配置后再对齐到 RGB。
  width: 1920
  height: 1080
  fps: 30
  depth_width: 1280
  depth_height: 720
  depth_fps: 30
  align_depth_to_color: true
  warmup_frames: 30
  flush_frames_after_motion: 8
  depth_min_mm: 300.0              # 赛题给出的 D435 最小深度约 0.3 m
  depth_max_mm: 1500.0
  depth_patch_px: 9                # 目标中心邻域，中值抗噪；必须为奇数
  temporal_depth_samples: 5
  max_temporal_depth_spread_mm: 8.0 # 多帧差值过大时拒绝抓取
  color_exposure: null             # null=自动曝光；固定曝光需现场实测
  depth_exposure: null

yolo:
  # 抓取角度只接受 Ultralytics OBB 权重；普通 detect 水平框会在初始化时被拒绝。
  device: "cuda:0"                # CUDA 不可用时程序自动回退 CPU 并报警
  image_size: 640
  confidence: 0.85
  iou: 0.45
  max_detections: 20
  chinese_font: "C:/Windows/Fonts/msyh.ttc"

  task3:
    model: "models/task3.pt"
    include_class_keywords: []
    exclude_class_keywords: []

calibration:
  # 比赛现场重新标定后，将 opencvCalibration.exe 生成的文件复制为下列文件名。
  eih_yaml: "config/calibration/CaliMatrixData.yaml"
  transform_node: "CamToTipTransform"

  # CamToTipTransform 通常表示“把相机坐标点变换到 Tip 坐标”的 4x4 矩阵。
  # 若多点验证发现方向相反，将 invert_cam_to_tip 改为 true。
  invert_cam_to_tip: false
  matrix_translation_unit: "m"    # 示例文件平移量约 0.02~0.12，因此单位为 m

  # Dobot 位姿到齐次矩阵的旋转约定。当前实现使用 Rz @ Ry @ Rx（ZYX 欧拉角）。
  # 必须用 3 个以上已知点验证方向和误差后才允许抓取。
  pose_rotation_order: "zyx"

  # ★现场必填：机械臂固定在拍照位、检测/放置共用空台面时的深度中值。
  table_depth_mm: 398

  # ★现场必填：吸盘刚好贴到检测/放置共用台面时机械臂 TCP 的 Z。
  robot_table_touch_z_mm: 100.0

  # 用户指定的计算式：抓取Z = 台面机器人Z + (空台深度 - 工件中心深度)。
  # 正的 press_down_mm 会让吸盘在计算表面基础上再向下压一点；初次验证保持 0。
  press_down_mm: 1.0
  xy_offset_mm: [2.5, 0]  #[5.0, 12.8] [6.0, 5.0]  # ★现场必填：相机光心到吸盘中心的 XY 偏移，单位 mm。正值表示相机在吸盘前方/右方。
  min_object_height_mm: 0.0
  max_object_height_mm: 120.0

robot:
  model: "Dobot E6"
  user_coordinate_index: 0       # ★现场确认，与手眼标定/示教使用的用户坐标系一致
  tool_coordinate_index: 0       # ★现场确认，与吸盘 TCP 和 EIH 的 Tip 定义一致

  # ★现场必填：相机完成 EIH 标定时使用的同一 Tip/TCP 在固定拍照位的位姿。
  # [X, Y, Z, Rx, Ry, Rz]，单位 mm/degree。
  photo_pose_mm_deg: [160, -60, 430, 180, 0, 0]
  # 判断“当前是否在拍照位”的位置/姿态允许误差，不属于运动工作空间限位。
  photo_pose_tolerance_mm: 2.0
  photo_pose_tolerance_deg: 2.0

  motion:
    # 抓取姿态：Rx/Ry 固定吸盘朝下；抓取 Rz 由 OBB+EIH 动态计算。
    # 放置姿态不再自动回正为 0，而是逐工件读取 place_poses_mm_deg。
    orientation_mm_deg: [180.0, 0, 0]
    # P1 与 P2 使用相同 Z，由 DobotStudio Pro 的 MovJ 直接规划 P1→P2。
    travel_speed_percent: 20
    pick_speed_percent: 10
    acceleration_percent: 20
    settle_ms: 300

  vacuum:
    # E6/V4.5 官方脚本使用 ToolDO（末端）或 DO（底座）；参考文件的 SetIODO 不采用。
    api: "ToolDO"                        # ★只能填 "ToolDO" 或 "DO"
    io_index: 1                   # ★现场确认末端吸盘数字输出号
    on_value: 1                      # ★现场点动确认极性，若相反则与 off_value 交换
    off_value: 0
    suction_wait_ms: 700
    release_wait_ms: 400
    feedback_di_index: null          # 可选：有真空压力开关才填写；不能用DO状态冒充吸住
    feedback_ok_level: 1
    feedback_timeout_ms: 1500

  lua:
    # ★填写运行 Python 的电脑有线网卡 IP，不是机器人控制器 IP。
    # 例如机器人 192.168.5.1、电脑可设 192.168.5.10。
    pc_server_ip: "192.168.5.100"  # 192.168.5.10
    pc_server_port: 2006
    reconnect_delay_ms: 2000

  # ★现场必填：七类工件的放置位姿，统一格式 [X, Y, Z, Rx, Ry, Rz]。
  # Z 必须保持 null；运行时 P2.Z 直接复用识别得到的 P1.Z。
  # X、Y、Rx、Ry、Rz 必须现场示教填写。
  place_poses_mm_deg:
    大圆柱:       [null, null, null, null, null, null]
    正方体:       [null, null, null, null, null, null]
    梯形:         [null, null, null, null, null, null]
    长方体:       [null, null, null, null, null, null]
    圆柱:         [null, null, null, null, null, null]
    六棱柱:       [null, null, null, null, null, null]
    平行四边形:   [null, null, null, null, null, null]

tasks:
  # 全流程只包含任务一和 3D识别抓取；原任务二已删除。
  task1:
    enabled: true
    robot_action: "none"            # 规则文件只要求识别/测量并输出

  task3:
    enabled: true
    # UI 可直接拖拽调整；归一化格式 [左, 上, 右, 下]，仅中心点在框内的目标参与识别。
    recognition_region: [0.0, 0.0, 1.0, 1.0]
    max_objects: 7                    # 七类工件，达到上限即结束本任务
    candidate_order: "left_to_right"
    route_by: "class"
    detect_timeout_s: 20.0
    empty_confirm_frames: 8
    stable_frames: 3
    stable_center_tolerance_px: 12
    stable_angle_tolerance_deg: 5.0

simulation:
  # 模拟模式会生成七类工件、深度图、DVS 结果和 Lua 完成应答，可完整演示界面。
  # 模拟画面保持轻量；真机仍严格使用上面的 D435 最大 RGB 分辨率。
  frame_width: 640
  frame_height: 480
  table_depth_mm: 700.0
  robot_table_touch_z_mm: 100.0
  command_delay_s: 0.15
  # Z 同样由模拟深度识别生成；不同 Rz 用于自动测试放置姿态是否透传。
  place_poses_mm_deg:
    大圆柱:       [175.0, 120.0, null, 180.0, 0.0,   0.0]
    正方体:       [215.0, 120.0, null, 180.0, 0.0,  15.0]
    梯形:         [255.0, 120.0, null, 180.0, 0.0,  30.0]
    长方体:       [295.0, 120.0, null, 180.0, 0.0,  45.0]
    圆柱:         [195.0,  75.0, null, 180.0, 0.0,   0.0]
    六棱柱:       [245.0,  75.0, null, 180.0, 0.0, -30.0]
    平行四边形:   [295.0,  75.0, null, 180.0, 0.0, -45.0]
